<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의 접수 완료 — Royal Mile</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100svh;display:grid;place-content:center;text-align:center;
    padding:2rem clamp(1.25rem,6vw,3rem);background:#F3EEE7;color:#313131;
    font-family:'Lyon Text Web','Noto Serif KR',ui-serif,Georgia,serif;
    font-weight:400;font-size:.875rem;letter-spacing:.057em;line-height:1.75;
    -webkit-font-smoothing:antialiased;word-break:keep-all}
  .eyebrow{font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:.625rem;
    font-weight:500;text-transform:uppercase;letter-spacing:.2em;color:#8a857c}
  h1{font-weight:400;font-size:clamp(1.375rem,1.2rem + .9vw,1.75rem);
    letter-spacing:.02em;line-height:1.4;margin:1.1rem 0 1.2rem}
  p{color:#5d5952;max-width:42ch;margin-inline:auto}
  a{display:inline-block;margin-top:2.25rem;color:#313131;text-decoration:underline;
    text-underline-offset:4px;text-decoration-thickness:1px;
    font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:.8125rem;letter-spacing:.05em}
</style>
</head>
<body>
  <p class="eyebrow">Royal Mile · Komatsu</p>
  <h1>문의가 접수되었습니다.</h1>
  <p>담당자가 확인 후 순차적으로 연락드리겠습니다.<br>급한 문의는 1599&#8202;—&#8202;3904로 주시기 바랍니다.</p>
  <a href="/">처음으로</a>
</body>
</html>
